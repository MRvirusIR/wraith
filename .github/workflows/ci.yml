name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: end-to-end demo
        run: python -m wraith demo --color never
      - name: offline analysis of the shipped capture
        run: python -m wraith analyze examples/poisoned-tools.json --fail-on high
      - name: scope gate blocks unknown hosts
        run: |
          if python -m wraith probe https://api.example.com/mcp; then
            echo "scope gate failed: probe was not blocked"; exit 1
          fi
